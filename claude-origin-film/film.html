<body>
<div id="wrap"><div id="stage">
  <canvas id="bg" width="1920" height="1080"></canvas>

<script>
(() => {
'use strict';
const W = 1920, H = 1080, DURATION = 153;
const stage = document.getElementById('stage');
const dom = document.getElementById('dom');
const ctx = document.getElementById('bg').getContext('2d');

/* ---------- 工具函数 ---------- */
const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
const lerp = (a, b, p) => a + (b - a) * p;
const prog = (t, s, d) => clamp((t - s) / d);
const smooth = (a, b, x) => { const p = clamp((x - a) / (b - a)); return p * p * (3 - 2 * p); };
const ease = {
  out: p => 1 - Math.pow(1 - p, 3),
  inOut: p => p < .5 ? 4 * p * p * p : 1 - Math.pow(-2 * p + 2, 3) / 2,
  back: p => { const c1 = 1.70158, c3 = c1 + 1; return p <= 0 ? 0 : 1 + c3 * Math.pow(p - 1, 3) + c1 * Math.pow(p - 1, 2); },
};
const rng = seed => () => { seed |= 0; seed = seed + 0x6D2B79F5 | 0; let t = Math.imul(seed ^ seed >>> 15, 1 | seed);
  t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; };
const esc = s => s.replace(/&/g, '&amp;').replace(/</g, '&lt;');
const blink = t => (t % 1.0) < 0.55;

const CUES = [];
const cue = (type, t, extra) => CUES.push(Object.assign({ type, t: +t.toFixed(3) }, extra || {}));
let ALLTEXT = '';

function div(parent, cls, html, css) {
  const d = document.createElement('div');
  if (cls) d.className = cls;
  if (html != null) d.innerHTML = html;
  if (css) Object.assign(d.style, css);
  parent.appendChild(d);
  return d;
}
const cline = (p, y, html, cls) => div(p, 'abs center ' + (cls || ''), html, { top: y + 'px' });
const lline = (p, x, y, html, cls) => div(p, 'abs ' + (cls || ''), html, { left: x + 'px', top: y + 'px' });
function chars(p, text, cls, y) {
  const c = div(p, 'abs center ' + cls, null, { top: y + 'px' });
  c.spans = [...text].map(ch => { const s = document.createElement('span'); s.className = 'ch'; s.textContent = ch === ' ' ? ' ' : ch; c.appendChild(s); return s; });
  return c;
}
function set(el, o, x = 0, y = 0, s = 1, b = 0, r = 0) {
  if (!(o > 0.002)) { if (el._v !== 0) { el.style.visibility = 'hidden'; el.style.opacity = '0'; el._v = 0; } return; }
  el._v = 1;
  el.style.visibility = 'visible';
  el.style.opacity = o.toFixed(4);
  el.style.transform = `translate(${x.toFixed(2)}px,${y.toFixed(2)}px)` + (s !== 1 ? ` scale(${s.toFixed(4)})` : '') + (r ? ` rotate(${r.toFixed(3)}deg)` : '');
  el.style.filter = b > 0.05 ? `blur(${b.toFixed(2)}px)` : 'none';
}
// 淡入（上浮 + 去模糊），可选淡出
function show(el, t, tin, tout, o = {}) {
  const { dy = 28, dx = 0, blur = 10, din = 0.9, dout = 0.7, s0 = 1, r = 0, max = 1 } = o;
  const r0 = o.r0 == null ? r : o.r0;
  const pi = ease.out(prog(t, tin, din));
  const po = tout == null ? 0 : ease.inOut(prog(t, tout, dout));
  set(el, pi * (1 - po) * max, dx * (1 - pi), dy * (1 - pi) - po * dy * 0.4, lerp(s0, 1, pi), (1 - pi) * blur + po * blur * 0.5, lerp(r0, r, pi));
}
// 打字机
function typer(p, x, y, segs, cls) {
  const el = div(p, 'abs ' + (cls || ''), '', { left: x + 'px', top: y + 'px' });
  el.segs = segs.map(s => ({ a: [...s.t], c: s.c }));
  el.chars = el.segs.flatMap(s => s.a);
  el.len = el.chars.length;
  el.cur = document.createElement('span'); el.cur.className = 'cursor';
  ALLTEXT += el.chars.join('');
  return el;
}
function typeDraw(el, t, start, cps, cursor) {
  const n = t < start ? 0 : Math.min(el.len, Math.floor((t - start) * cps) + 1);
  if (el._n !== n) {
    el._n = n;
    let rem = n, html = '';
    for (const s of el.segs) {
      if (rem <= 0) break;
      const k = Math.min(rem, s.a.length); rem -= k;
      const part = esc(s.a.slice(0, k).join(''));
      html += s.c ? `<span class="${s.c}">${part}</span>` : part;
    }
    el.innerHTML = html;
    el.appendChild(el.cur);
  }
  el.cur.style.visibility = cursor ? 'visible' : 'hidden';
}
const typeCues = (el, start, cps, vol) => el.chars.forEach((c, k) => { if (c.trim()) cue('type', start + k / cps, { vol }); });

/* ---------- 场景与画布图层 ---------- */
const SCENES = [], PAINTERS = [];
function mkScene(name, t0, t1) {
  const sc = { name, t0, t1, root: div(dom, 'scene'), draw: () => {}, measure: null, _on: false };
  sc.root.dataset.name = name;
  SCENES.push(sc);
  return sc;
}
const PAINT = (c0, c1, fn) => PAINTERS.push({ c0, c1, fn });

function glowDot(x, y, r, rgb, a) {
  if (!(a > 0.003)) return;
  const g = ctx.createRadialGradient(x, y, 0, x, y, r * 4);
  g.addColorStop(0, `rgba(${rgb},${(0.42 * a).toFixed(3)})`); g.addColorStop(1, `rgba(${rgb},0)`);
  ctx.fillStyle = g; ctx.beginPath(); ctx.arc(x, y, r * 4, 0, 6.2832); ctx.fill();
  ctx.fillStyle = `rgba(${rgb},${a.toFixed(3)})`; ctx.beginPath(); ctx.arc(x, y, r, 0, 6.2832); ctx.fill();
}

/* ---------- 背景：底色、环境光、浮尘 ---------- */
const GLOWS = [ // [t0, t1, 淡入, 淡出, x, y, 半径, 颜色, 强度]
  [8.6, 15.0, 1.8, 1.0, 960, 520, 820, '229,141,92', 0.17],
  [15.0, 28.0, 1.5, 1.2, 1460, 500, 700, '236,197,131', 0.10],
  [40.0, 52.0, 1.2, 1.0, 960, 430, 900, '229,141,92', 0.07],
  [52.0, 62.0, 1.2, 1.0, 960, 420, 900, '139,184,208', 0.09],
  [62.0, 75.0, 1.2, 1.0, 960, 500, 900, '229,141,92', 0.06],
  [75.0, 88.0, 1.2, 1.0, 1450, 520, 800, '236,197,131', 0.10],
  [88.0, 98.0, 1.2, 1.0, 560, 520, 700, '229,141,92', 0.12],
  [98.0, 118.0, 1.5, 1.0, 960, 600, 1100, '236,197,131', 0.07],
  [118.0, 131.0, 1.2, 1.0, 960, 400, 900, '139,184,208', 0.09],
  [131.0, 142.8, 1.6, 1.0, 960, 360, 800, '229,141,92', 0.13],
  [147.0, 153.0, 1.4, 1.4, 960, 480, 900, '229,141,92', 0.10],
];
const DUST = (() => { const R = rng(7); return Array.from({ length: 170 }, () => ({
  x: R() * W, y: R() * H, vx: (R() - .5) * 10, vy: -(R() * 6 + 1), s: R() * 1.5 + 0.5, a: R() * 0.5 + 0.15, f: R() * 1.5 + 0.3, ph: R() * 6.28 })); })();
const dustAmt = t => 0.75 * smooth(8.2, 10.5, t) * (1 - smooth(141.8, 142.8, t)) + 0.5 * smooth(147, 148.5, t) * (1 - smooth(151.6, 152.8, t));

function drawBG(t) {
  ctx.globalAlpha = 1;
  ctx.fillStyle = '#0d0c0b'; ctx.fillRect(0, 0, W, H);
  for (const [t0, t1, fi, fo, x, y, r, c, a] of GLOWS) {
    const k = a * smooth(t0, t0 + fi, t) * (1 - smooth(t1 - fo, t1, t));
    if (k <= 0.001) continue;
    const g = ctx.createRadialGradient(x, y, 0, x, y, r);
    g.addColorStop(0, `rgba(${c},${k.toFixed(4)})`); g.addColorStop(1, `rgba(${c},0)`);
    ctx.fillStyle = g; ctx.fillRect(x - r, y - r, r * 2, r * 2);
  }
  const amt = dustAmt(t);
  if (amt > 0.001) {
    ctx.fillStyle = '#f3ede2';
    for (const d of DUST) {
      let x = (d.x + d.vx * t) % W; if (x < 0) x += W;
      let y = (d.y + d.vy * t) % H; if (y < 0) y += H;
      ctx.globalAlpha = d.a * amt * (0.55 + 0.45 * Math.sin(t * d.f + d.ph));
      ctx.beginPath(); ctx.arc(x, y, d.s, 0, 6.2832); ctx.fill();
    }
    ctx.globalAlpha = 1;
  }
}

/* ---------- “种子”光点：从创立的想法，到阅读，再到结尾 ---------- */
function coreState(t) {
  if (t >= 24.8 && t < 40.6) {
    const ap = ease.out(prog(t, 24.9, 0.8));
    const mv = ease.inOut(prog(t, 27.0, 1.8));
    const grow = ease.inOut(prog(t, 28.6, 10.4));
    return { x: lerp(1460, 960, mv), y: lerp(500, 560, mv), r: lerp(6, 11, mv) + grow * 22,
             a: ap * (1 - ease.inOut(prog(t, 39.3, 1.1))) };
  }
  if (t >= 131 && t < 143.4) {
    const ap = ease.out(prog(t, 131.2, 1.6));
    const out = ease.inOut(prog(t, 141.9, 1.2));
    return { x: 960, y: 350, r: (22 + 3 * Math.sin(t * 1.7)) * (1 - out * 0.85), a: ap * (1 - out) };
  }
  return null;
}
function drawCore(t) {
  const c = coreState(t);
  if (!c || c.a <= 0.002) return;
  let g = ctx.createRadialGradient(c.x, c.y, 0, c.x, c.y, c.r * 7);
  g.addColorStop(0, `rgba(229,141,92,${(0.38 * c.a).toFixed(3)})`);
  g.addColorStop(0.4, `rgba(229,141,92,${(0.10 * c.a).toFixed(3)})`);
  g.addColorStop(1, 'rgba(229,141,92,0)');
  ctx.fillStyle = g; ctx.fillRect(c.x - c.r * 7, c.y - c.r * 7, c.r * 14, c.r * 14);
  g = ctx.createRadialGradient(c.x, c.y, 0, c.x, c.y, c.r * 1.6);
  g.addColorStop(0, `rgba(255,251,244,${c.a.toFixed(3)})`);
  g.addColorStop(0.45, `rgba(250,226,182,${(0.85 * c.a).toFixed(3)})`);
  g.addColorStop(1, 'rgba(236,197,131,0)');
  ctx.fillStyle = g; ctx.beginPath(); ctx.arc(c.x, c.y, c.r * 1.6, 0, 6.2832); ctx.fill();
}

/* 漂浮的文字素材 */
const POOL = [...'天地人和春夏秋冬山川河海风花雪月诗书礼乐日月星辰知学问道理心光明梦想故事朋友世界科学历史数学音乐语言思考为什么因为所以如果你好谢谢'].concat(
  ['hello', 'why', 'because', 'love', 'light', 'world', 'idea', 'learn', 'story', 'the', 'and', 'what if',
   'def', 'return', '{ }', '=>', 'for', 'if', 'import', '</>', 'print()', '[ ]', 'λ', 'π', '∑', '∫', '√2', 'x²', '∞',
   'e=mc²', '1+1=2', 'Ω', 'あ', 'の', 'é', 'ß', '42', '0.618', 'Я']);
const isAscii = s => /^[\x20-\x7e]+$/.test(s);

/* ---------- 神经网络（预训练、可解释性两场共用） ---------- */
const NET = (() => {
  const xs = [300, 520, 740, 960, 1180, 1400, 1620], counts = [4, 7, 9, 10, 9, 7, 4];
  const R = rng(4242);
  const layers = xs.map((x, l) => Array.from({ length: counts[l] }, (_, k) => ({ x, yo: (k - (counts[l] - 1) / 2) * 66, l, k, act: 0 })));
  const edges = [];
  for (let l = 0; l < layers.length - 1; l++) for (const a of layers[l]) for (const b of layers[l + 1]) edges.push({ a, b, f: 0.4 + R() * 1.6, ph: R() * 6.283 });
  const chains = Array.from({ length: 90 }, () => ({ ts: 52.9 + R() * 7.8, sp: 0.17 + R() * 0.07, path: layers.map(L => L[Math.floor(R() * L.length)]) }));
  const labels = Array.from({ length: 7 }, () => ({ e: edges[Math.floor(R() * edges.length)], seed: Math.floor(R() * 1e6), ox: (R() - .5) * 30, oy: -16 - R() * 10 }));
  return { layers, edges, chains, labels, nodes: layers.flat() };
})();

function drawNet(t, o) {
  const { cy, tb, a } = o;
  const rgb = o.tint || '243,237,226';
  const t0 = n => tb + n.l * 0.16 + n.k * 0.03;
  const vis = n => clamp(prog(t, t0(n), 0.3));
  for (const n of NET.nodes) n.act = 0;
  const active = [];
  if (o.pulses) for (const c of NET.chains) {
    const u = (t - c.ts) / c.sp;
    if (u < 0 || u >= c.path.length - 1) continue;
    const l = Math.floor(u), f = u - l;
    c.path[l].act += (1 - f) * 0.9; c.path[l + 1].act += f * f;
    active.push({ c, l, f });
  }
  ctx.lineWidth = 1;
  for (const e of NET.edges) {
    const v = Math.min(vis(e.a), vis(e.b));
    if (v <= 0) continue;
    const w = 0.05 + 0.11 * (0.5 + 0.5 * Math.sin(t * e.f + e.ph));
    ctx.strokeStyle = `rgba(${rgb},${(w * v * a).toFixed(3)})`;
    ctx.beginPath(); ctx.moveTo(e.a.x, cy + e.a.yo); ctx.lineTo(e.b.x, cy + e.b.yo); ctx.stroke();
  }
  for (const { c, l, f } of active) {
    const A = c.path[l], B = c.path[l + 1];
    ctx.lineWidth = 1.6; ctx.strokeStyle = `rgba(139,184,208,${(0.32 * a).toFixed(3)})`;
    ctx.beginPath(); ctx.moveTo(A.x, cy + A.yo); ctx.lineTo(B.x, cy + B.yo); ctx.stroke();
    for (let i = 0; i < 5; i++) {
      const ff = f - i * 0.06; if (ff < 0) break;
      const e2 = ease.inOut(ff);
      glowDot(lerp(A.x, B.x, e2), lerp(cy + A.yo, cy + B.yo, e2), 3.4 - i * 0.55, '205,230,242', a * (1 - i * 0.2));
    }
  }
  ctx.lineWidth = 2;
  for (const n of NET.nodes) {
    const s = ease.back(prog(t, t0(n), 0.45));
    if (s <= 0) continue;
    const y = cy + n.yo;
    ctx.fillStyle = '#151412'; ctx.strokeStyle = `rgba(${rgb},${(0.6 * a).toFixed(3)})`;
    ctx.beginPath(); ctx.arc(n.x, y, 7 * s, 0, 6.2832); ctx.fill(); ctx.stroke();
    const act = Math.min(1, n.act);
    if (act > 0.02) glowDot(n.x, y, 5 + 4 * act, '205,230,242', act * a);
  }
  ctx.lineWidth = 1;
  if (o.labels) {
    ctx.font = '500 17px "JetBrains Mono"'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    NET.labels.forEach((L, i) => {
      const la = a * smooth(54.6 + i * 0.25, 55.2 + i * 0.25, t);
      if (la <= 0.003) return;
      const v = (rng(L.seed + Math.floor(t * 10))() * 2 - 1).toFixed(4);
      ctx.fillStyle = `rgba(236,197,131,${(0.8 * la).toFixed(3)})`;
      ctx.fillText(v, (L.e.a.x + L.e.b.x) / 2 + L.ox, cy + (L.e.a.yo + L.e.b.yo) / 2 + L.oy);
    });
  }
}

/* 场景 10：可解释性（118–131s） */

  [125.1, 1290, -66], [126.5, 1290, -66], [127.7, 1510, 115], [131.0, 1510, 115]];

  return [L[1], L[2]];

/* 场景切换时的气流声 */

/* ---------- 渲染入口 ---------- */
function render(t) {
  drawBG(t);
  for (const sc of SCENES) {
    const on = t >= sc.t0 && t < sc.t1;
    if (on !== sc._on) { sc.root.style.display = on ? 'block' : 'none'; sc._on = on; }
    if (on) sc.draw(t);
  }
  for (const p of PAINTERS) if (t >= p.c0 && t < p.c1) p.fn(t);
  drawCore(t);
}

async function prepare() {
  const text = ALLTEXT + dom.textContent + POOL.join('') + FEATS.map(f => f.label).join('') + '0123456789.-%✓…—「」·';
  const specs = ['300', '400', '500', '700'].map(w => `${w} 40px "Noto Sans SC"`)
    .concat(['400', '700', '900'].map(w => `${w} 40px "Noto Serif SC"`))
    .concat(['400', '500'].map(w => `${w} 40px "JetBrains Mono"`));
  await Promise.all(specs.map(s => document.fonts.load(s, text).catch(() => [])));
  await document.fonts.ready;
  for (const sc of SCENES) if (sc.measure) {
    sc.root.style.display = 'block'; sc.measure(); sc.root.style.display = 'none'; sc._on = false;
  }
  return { duration: DURATION, cues: CUES };
}

// 静态胶片颗粒，减轻暗部色带
(() => {
  const c = document.createElement('canvas'); c.width = c.height = 256;
  const g = c.getContext('2d'), img = g.createImageData(256, 256), R = rng(99);
  for (let i = 0; i < img.data.length; i += 4) { const v = R() * 255; img.data[i] = img.data[i + 1] = img.data[i + 2] = v; img.data[i + 3] = 255; }
  g.putImageData(img, 0, 0);
  document.getElementById('grain').style.backgroundImage = `url(${c.toDataURL()})`;
})();

window.render = render;
window.prepare = prepare;
window.DURATION = DURATION;

/* ---------- 直接在浏览器里观看 ---------- */
if (!window.RENDER) {
  const fit = () => { stage.style.transform = `scale(${Math.min(innerWidth / W, innerHeight / H)})`; };
  addEventListener('resize', fit); fit();
  const btn = document.getElementById('play');
  const audio = new Audio('music.m4a');
  let t0 = 0;
  prepare().then(() => { render(12.6); btn.style.display = ''; });
  const loop = now => {
    const t = audio.currentTime > 0 && !audio.paused ? audio.currentTime : (now - t0) / 1000;
    render(Math.min(t, DURATION - 0.001));
    if (t < DURATION) requestAnimationFrame(loop); else btn.style.display = '';
  };
  btn.addEventListener('click', () => {
    btn.style.display = 'none';
    audio.currentTime = 0; audio.play().catch(() => {});
    t0 = performance.now(); requestAnimationFrame(loop);
  });
}
})();
